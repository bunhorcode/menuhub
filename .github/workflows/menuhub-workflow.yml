name: MenuHub CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel any in-progress run on the same branch to avoid wasted minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # CI: Lint → Type-check → Build
  # Runs on every push and every PR against main
  # ─────────────────────────────────────────────────────────────────────────────
  ci:
    name: 🔍 Lint · Type-check · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"   # Node 20 EOL April 2026 — 22 is current LTS
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ESLint — matches your `npm run lint` script
      - name: Run ESLint
        run: npm run lint

      # Cache Next.js build output (.next/cache) between runs.
      # Key is tied to OS + package-lock so it auto-invalidates on dep changes.
      # Restore-key allows partial cache hits when only source files changed.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      # Build first — generates .next/types/**/*.ts which tsconfig.json includes.
      # Running tsc BEFORE build causes exit code 1 on a fresh CI runner.
      - name: Next.js build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      # TypeScript strict type-check — runs AFTER build so .next/types/** exist
      - name: TypeScript type-check
        run: npx tsc --noEmit

